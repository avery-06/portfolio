    <title>Cinematography Robotic Arm | Avery Wong</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --sapphire: #0F52BA; --bg-color: #ffffff; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: #1d1d1f; 
            margin: 0; 
            -webkit-font-smoothing: antialiased; 
        }

        .text-sapphire { color: var(--sapphire); }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        
        @keyframes spin-nav { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-gear-nav { animation: spin-nav 8s linear infinite; }

        .apple-bubble { 
            background: #f5f5f7; 
            border-radius: 3rem; 
            border: 1px solid rgba(0,0,0,0.03); 
            padding: 3rem;
            margin-bottom: 2rem;
        }

        .project-hero {
            padding-top: 8rem;
            padding-bottom: 4rem;
        }

        img { border-radius: 1.5rem; width: 100%; height: auto; border: 1px solid rgba(0,0,0,0.05); }
        .caption { text-align: center; font-size: 0.7rem; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.75rem; }
    </style>
</head>
