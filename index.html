<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avery Wong | Mechanical Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --sapphire: #0F52BA; --bg-color: #ffffff; --project-bg: #ffffff; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: #1d1d1f; margin: 0; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

        .text-sapphire { color: var(--sapphire); }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        
        @keyframes spin-nav { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-gear-nav { animation: spin-nav 8s linear infinite; }

        .apple-bubble { background: #f5f5f7; border-radius: 3.5rem; border: 1px solid rgba(0,0,0,0.03); }
        
        /* Updated Project Bubble: Expands over neighbors */
        .project-bubble { 
            background: white; border-radius: 3.5rem; display: flex; align-items: center; justify-content: center; 
            min-height: 280px; border: 1px solid rgba(0,0,0,0.08); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); 
            padding: 2rem; text-align: center; cursor: pointer; text-decoration: none; color: inherit;
            position: relative; z-index: 1; /* relative allows z-index to work */
        }
        .project-bubble:hover { 
            transform: scale(1.12); /* Aggressive expansion */
            z-index: 50; /* Sits on top of all other bubbles */
            box-shadow: 0 40px 80px rgba(0,0,0,0.1); 
            border-color: var(--sapphire);
        }

        /* Preview Window Styles */
        #project-preview-container {
            position: fixed; top: 15%; right: 5%; width: 400px; height: 500px; 
            z-index: 150; pointer-events: none; opacity: 0; transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            border-radius: 2rem; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            border: 4px solid white; background: white;
        }
        #project-preview-container.active { opacity: 1; transform: translateY(0); }
        #preview-iframe { width: 100%; height: 100%; border: none; transform: scale(0.8); transform-origin: top left; width: 125%; height: 125%; }

        .cursor { display: inline-block; width: 3px; background-color: var(--sapphire); margin-left: 4px; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        #transition-track { height: 600vh; position: relative; }
        .sticky-viewport { position: sticky; top: 0; height: 100vh; width: 100%; overflow: hidden; }

        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; }

        #projects-layer { 
            z-index: 10; opacity: 0; background: var(--project-bg); padding: 80px 2rem; 
            overflow-y: auto; pointer-events: none; justify-content: flex-start;
            transform: scale(0.05); scrollbar-width: none; -ms-overflow-style: none; will-change: transform, opacity;
        }
        #projects-layer::-webkit-scrollbar { display: none; }

        #hero-layer { z-index: 30; justify-content: center; will-change: opacity; }

        .card-container { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            perspective: 2000px; z-index: 20; pointer-events: none; 
        }
        
        .flip-card { width: 800px; height: 800px; transform-style: preserve-3d; will-change: transform; }
        .card-face { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            -webkit-backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 80px;
        }
        
        .card-front { background: var(--bg-color); overflow: hidden; border: 1px solid #eee; }
        .card-back { background: var(--bg-color); transform: rotateY(180deg); position: relative; }

        #main-gear-svg { width: 70%; height: 70%; fill: #333333; will-change: transform; }
        
        .static-label {
            position: absolute; font-weight: 800; font-size: 32px; color: #1d1d1f;
            text-transform: uppercase; letter-spacing: 0.1em; pointer-events: none; z-index: 10;
        }

        #image-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 2.5rem; filter: grayscale(100%); }
    </style>
</head>
<body>

<div id="project-preview-container">
    <iframe id="preview-iframe" src="about:blank"></iframe>
</div>

<nav class="glass fixed top-0 w-full z-[200] border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-6 h-12 flex justify-between items-center text-sm font-medium">
        <!-- Logo with Force Reload to Top -->
        <div class="flex items-center gap-2 cursor-pointer group" onclick="reloadToTop()">
            <svg class="w-5 h-5 text-sapphire animate-gear-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0 .33-1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span class="font-bold group-hover:text-sapphire transition-colors">Avery Wong</span>
        </div>
        <div class="space-x-8">
            <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="text-gray-500 hover:text-black transition">About</button>
            <a href="mailto:averywong3@gmail.com" class="hover:text-sapphire transition">Contact</a>
        </div>
    </div>
</nav>

<div id="transition-track">
    <div class="sticky-viewport">
        <div id="projects-layer" class="layer">
            <div class="max-w-6xl mx-auto w-full px-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-20 pb-20">
                    <a href="project-1.html" class="project-bubble" onmouseenter="showPreview('project-1.html')" onmouseleave="hidePreview()">
                        <h3 class="text-3xl font-bold">Robotic Cinematography Arm</h3>
                    </a>
                    <a href="project-2.html" class="project-bubble bg-[#1d1d1f] text-white" onmouseenter="showPreview('project-2.html')" onmouseleave="hidePreview()">
                        <h3 class="text-3xl font-bold">Smart Knee Sleeve</h3>
                    </a>
                    <a href="project-3.html" class="project-bubble" onmouseenter="showPreview('project-3.html')" onmouseleave="hidePreview()">
                        <h3 class="text-3xl font-bold">Integrated Desk Outlets</h3>
                    </a>
                    <a href="project-4.html" class="project-bubble bg-zinc-200" onmouseenter="showPreview('project-4.html')" onmouseleave="hidePreview()">
                        <h3 class="text-3xl font-bold text-zinc-800">Mechanical Dissections</h3>
                    </a>
                </div>
            </div>
        </div>

        <div id="hero-layer" class="layer px-6">
            <div class="text-center mb-12">
                <div class="text-2xl md:text-4xl font-bold tracking-tight mb-2 h-10">
                    <span id="name-type"></span><span id="name-cursor" class="cursor"></span>
                </div>
                <h1 class="text-6xl md:text-8xl font-extrabold tracking-tighter leading-none h-24 md:h-32">
                    <span id="title-type"></span><span id="title-cursor" class="cursor hidden"></span>
                </h1>
            </div>
            <div id="about-bubble" class="apple-bubble max-w-5xl w-full p-8 md:p-12 flex flex-col md:flex-row items-center gap-12">
                <div class="flex-1 space-y-6">
                    <h2 class="text-5xl font-extrabold tracking-tight">About</h2>
                    <p class="text-gray-500 text-lg leading-relaxed">Mechanical engineering student at the University of Toronto. Specializing in functional prototyping and elegant R&D solutions.</p>
                    <div class="flex flex-wrap gap-4">
                        <a href="https://www.linkedin.com/in/averywong0" target="_blank" class="px-8 py-4 bg-white border border-gray-200 rounded-3xl text-sm font-bold hover:border-sapphire transition shadow-sm uppercase">LinkedIn ↗</a>
                        <div class="px-8 py-4 bg-white border border-gray-200 rounded-3xl text-sm font-bold text-sapphire shadow-sm">averywong3@gmail.com</div>
                    </div>
                </div>
                <div id="image-slot" class="w-full md:w-[320px] h-[320px] flex-shrink-0"><img src="headshot.jpg" alt="Avery Wong"></div>
            </div>
        </div>

        <div class="card-container">
            <div class="flip-card" id="main-card">
                <div class="card-face card-front" id="front-face"><img src="headshot.jpg" alt="Transition" class="w-full h-full object-cover grayscale"></div>
                <div class="card-face card-back" id="back-face">
                    <div class="static-label">Projects</div>
                    <svg id="main-gear-svg" viewBox="0 0 100 100">
                        <path d="M100 42.6V57.4L88.4 59.4C87.4 63 85.8 66.4 83.7 69.4L90.5 78.9L79.9 89.5L70.4 82.7C67.4 84.8 64 86.4 60.4 87.4L58.4 99H43.6L41.6 87.4C38 86.4 34.6 84.8 31.6 82.7L22.1 89.5L11.5 78.9L18.3 69.4C16.2 66.4 14.6 63 13.6 59.4L2 57.4V42.6L13.6 40.6C14.6 37 16.2 33.6 18.3 30.6L11.5 21.1L22.1 10.5L31.6 17.3C34.6 15.2 38 13.6 41.6 12.6L43.6 1H58.4L60.4 12.6C64 13.6 67.4 15.2 70.4 17.3L79.9 10.5L90.5 21.1L83.7 30.6C85.8 33.6 87.4 37 88.4 40.6L100 42.6ZM51 31C40 31 31 40 31 51C31 62 40 71 51 71C62 71 71 62 71 51C71 40 62 31 51 31Z" fill-rule="evenodd"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let cachedSlotRect = null, trackHeight = 0, vh = 0, vw = 0;

    // Force reload and jump to top
    function reloadToTop() {
        window.scrollTo(0, 0);
        // Using window.location.pathname ensures we clear hashes/scroll anchors
        window.location.href = window.location.origin + window.location.pathname;
    }

    const previewContainer = document.getElementById('project-preview-container');
    const previewIframe = document.getElementById('preview-iframe');

    function showPreview(url) {
        previewIframe.src = url;
        previewContainer.classList.add('active');
    }

    function hidePreview() {
        previewContainer.classList.remove('active');
        setTimeout(() => { if(!previewContainer.classList.contains('active')) previewIframe.src = "about:blank"; }, 500);
    }

    function updateMetrics() {
        const slot = document.getElementById('image-slot'), track = document.getElementById('transition-track');
        if(slot) cachedSlotRect = slot.getBoundingClientRect(); 
        trackHeight = track.offsetHeight;
        vh = window.innerHeight; vw = window.innerWidth;
    }

    function type(elId, fullText, speed, callback) {
        let i = 0; const el = document.getElementById(elId); const blueWords = ["Avery", "Engineer"];
        const timer = setInterval(() => {
            let currentStr = fullText.substring(0, i + 1); let words = currentStr.split(/(\s+)/);
            let html = "";
            words.forEach(word => {
                const cleanWord = word.trim().replace(/[^\w]/g, '');
                if (blueWords.includes(cleanWord) || blueWords.some(bw => bw.startsWith(cleanWord) && cleanWord.length > 0)) {
                    html += `<span class="text-sapphire">${word}</span>`;
                } else { html += `<span>${word}</span>`; }
            });
            el.innerHTML = html; i++;
            if (i === fullText.length) { clearInterval(timer); if (callback) callback(); }
        }, speed);
    }

    window.onload = () => {
        updateMetrics();
        type("name-type", "Avery Wong", 100, () => {
            document.getElementById("name-cursor").style.display = "none";
            document.getElementById("title-cursor").classList.remove("hidden");
            type("title-type", "Mechanical Engineer.", 80, null);
        });
        requestAnimationFrame(handleScroll);
    };

    const card = document.getElementById('main-card'), frontFace = document.getElementById('front-face');
    const gearSvg = document.getElementById('main-gear-svg'), hero = document.getElementById('hero-layer'), projects = document.getElementById('projects-layer');

    function handleScroll() {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        let progress = scrollTop / (trackHeight - vh);
        progress = Math.max(0, Math.min(1, progress));

        let x=0, y=0, scale=0.4, rotY=0, rotZ=0, hOp=1, pOp=0, pScale=0.05, cardOp=1;
        const startX = (cachedSlotRect.left + cachedSlotRect.width/2) - (vw/2);
        const startY = (cachedSlotRect.top + cachedSlotRect.height/2) - (vh/2);

        hOp = Math.max(0, 1 - (progress * 10));

        if (progress <= 0.1) { 
            x = startX; y = startY; scale = 0.4; 
        } 
        else if (progress <= 0.3) {
            const p = (progress - 0.1) / 0.2;
            x = startX * (1 - p); y = startY * (1 - p); rotY = p * 180; rotZ = p * 90; scale = 0.4;
        } 
        else if (progress <= 0.75) {
            const p = (progress - 0.3) / 0.45;
            rotY = 180; 
            rotZ = 90 + (p * 500);
            scale = 0.4 + (Math.pow(p, 2) * (10.2 - 0.4));
            cardOp = 1; pOp = 0; pScale = 0.05;
        }
        else {
            const p = (progress - 0.75) / 0.25; 
            rotY = 180;
            rotZ = 590 + (p * 220);
            scale = 10.2 + (p * 5);
            cardOp = 1 - (p * 1.5);
            pOp = p;
            pScale = 0.05 + (p * 0.95);
        }

        frontFace.style.opacity = (rotY > 90) ? '0' : '1';
        card.style.transform = `translate3d(${x}px, ${y}px, 0) rotateY(${rotY}deg) scale(${scale})`;
        card.style.opacity = cardOp;
        gearSvg.style.transform = `rotate(${rotZ}deg)`;
        
        hero.style.opacity = hOp;
        projects.style.opacity = pOp;
        projects.style.transform = `scale(${pScale})`;

        if (progress >= 0.98) {
            projects.style.pointerEvents = 'auto'; projects.style.zIndex = '100';
        } else {
            projects.style.pointerEvents = 'none'; projects.style.zIndex = '10';
            hidePreview(); 
        }
    }

    window.addEventListener('scroll', () => requestAnimationFrame(handleScroll), { passive: true });
    window.addEventListener('resize', () => { updateMetrics(); handleScroll(); });
</script>
</body>
</html>
