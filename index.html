<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avery Wong | Mechanical Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --sapphire: #0F52BA; --bg-color: #f5f5f7; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1d1d1f; margin: 0; overflow-x: hidden; }

        .text-sapphire { color: var(--sapphire); }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        
        @keyframes spin-nav { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-gear-nav { animation: spin-nav 8s linear infinite; }

        .apple-bubble { background: var(--bg-color); border-radius: 3.5rem; border: 1px solid rgba(0,0,0,0.03); }
        .project-bubble { background: white; border-radius: 3.5rem; display: flex; align-items: center; justify-content: center; min-height: 350px; border: 1px solid rgba(0,0,0,0.05); transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); margin-bottom: 2rem; }
        .project-bubble:hover { transform: translateY(-5px) scale(1.01); }

        .cursor { display: inline-block; width: 3px; background-color: var(--sapphire); margin-left: 4px; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* SCROLL ENGINE */
        #scroll-wrapper { position: relative; }
        #transition-track { height: 500vh; position: relative; }
        
        .sticky-viewport { 
            position: sticky; 
            top: 0; 
            height: 100vh; 
            width: 100%; 
            overflow: hidden; 
        }

        .layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }

        /* The Gear Portal Container */
        .card-container { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            perspective: 2000px; 
            z-index: 100; 
            pointer-events: none; 
        }
        
        .flip-card { width: 1000px; height: 1000px; transform-style: preserve-3d; will-change: transform; }
        
        .card-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        .card-front { background: white; border-radius: 80px; overflow: hidden; z-index: 2; }
        /* Gear card face - background transparent to see projects through hole */
        .card-back { background: transparent; transform: rotateY(180deg); z-index: 1; }

        /* Massive Gear SVG with a hole in center */
        #main-gear-svg { 
            width: 100%; 
            height: 100%; 
            color: #1d1d1f; 
            fill: #ffffff; /* This fills the gear body */
            stroke: none;
        }

        #projects-reveal-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 50;
            padding: 100px 1.5rem;
            overflow-y: auto;
            background: var(--bg-color);
        }
    </style>
</head>
<body>

<nav class="glass fixed top-0 w-full z-[200] border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-6 h-12 flex justify-between items-center text-sm font-medium">
        <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-sapphire animate-gear-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0 .33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span class="font-bold">Avery Wong</span>
        </div>
        <div class="space-x-8">
            <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="text-gray-500 hover:text-black transition">About</button>
            <a href="mailto:averywong3@gmail.com" class="hover:text-sapphire transition">Contact</a>
        </div>
    </div>
</nav>

<div id="scroll-wrapper">
    <div id="transition-track">
        <div class="sticky-viewport">
            
            <!-- PROJECTS REVEAL (Hidden initially, revealed through gear hole) -->
            <div id="projects-reveal-layer">
                <div class="max-w-5xl mx-auto w-full pt-10">
                    <h2 class="text-6xl font-black mb-12 tracking-tighter">Selected Projects</h2>
                    <div class="grid gap-8">
                        <div class="project-bubble p-12">
                            <h3 class="text-4xl font-bold">Cinematography Robotic Arm</h3>
                        </div>
                        <div class="project-bubble bg-[#1d1d1f] text-white p-12">
                            <h3 class="text-4xl font-bold">Smart Rehabilitation Sleeve</h3>
                        </div>
                        <div class="project-bubble p-12">
                            <h3 class="text-4xl font-bold">Integrated Power Desk</h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- HERO -->
            <div id="hero-layer" class="layer px-6">
                <div class="text-center mb-12">
                    <div class="text-2xl md:text-4xl font-bold tracking-tight mb-2 h-10">
                        <span id="name-type"></span><span id="name-cursor" class="cursor"></span>
                    </div>
                    <h1 class="text-6xl md:text-8xl font-extrabold tracking-tighter leading-none h-24 md:h-32">
                        <span id="title-type"></span><span id="title-cursor" class="cursor hidden"></span>
                    </h1>
                </div>

                <div id="about-bubble" class="apple-bubble max-w-5xl w-full p-8 md:p-12 flex flex-col md:flex-row items-center gap-12">
                    <div class="flex-1 space-y-6">
                        <h2 class="text-5xl font-extrabold tracking-tight">About</h2>
                        <p class="text-gray-500 text-lg leading-relaxed">Mechanical engineering student at the University of Toronto. Specializing in functional prototyping and elegant R&D solutions.</p>
                        <div class="flex flex-wrap gap-3">
                            <a href="https://www.linkedin.com/in/averywong0" target="_blank" class="inline-block bg-white border border-gray-200 px-6 py-3 rounded-2xl text-sm font-bold hover:border-sapphire transition uppercase">LinkedIn ↗</a>
                            <a href="mailto:averywong3@gmail.com" class="inline-block bg-white border border-gray-200 px-6 py-3 rounded-2xl text-sm font-bold hover:text-sapphire transition">averywong3@gmail.com</a>
                        </div>
                    </div>
                    <div id="image-slot" class="w-full md:w-[320px] h-[320px] flex-shrink-0"></div>
                </div>
            </div>

            <!-- TRANSITION CARD (THE PORTAL) -->
            <div class="card-container">
                <div class="flip-card" id="main-card">
                    <div class="card-face card-front" id="front-face">
                        <!-- Placeholder for Headshot -->
                        <div class="w-full h-full bg-gray-200 flex items-center justify-center text-gray-400">
                             <img src="headshot.jpg" alt="Avery" class="w-full h-full object-cover grayscale brightness-105">
                        </div>
                    </div>
                    <div class="card-face card-back">
                        <!-- Custom Gear SVG with a hollow center -->
                        <svg id="main-gear-svg" viewBox="0 0 24 24">
                            <path fill-rule="evenodd" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm-9 5c0-.74.13-1.45.36-2.11L1.61 8.14a1 1 0 0 1-.25-1.24l2-3.46a1 1 0 0 1 1.24-.39l1.75.71a8.94 8.94 0 0 1 3.65-2.11V1a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v.65c1.33.43 2.56 1.15 3.65 2.11l1.75-.71a1 1 0 0 1 1.24.39l2 3.46a1 1 0 0 1-.25 1.24l-1.75 1.75c.23.66.36 1.37.36 2.11s-.13 1.45-.36 2.11l1.75 1.75a1 1 0 0 1 .25 1.24l-2 3.46a1 1 0 0 1-1.24.39l-1.75-.71a8.94 8.94 0 0 1-3.65 2.11V23a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-.65a8.94 8.94 0 0 1-3.65-2.11l-1.75.71a1 1 0 0 1-1.24-.39l-2-3.46a1 1 0 0 1 .25-1.24l1.75-1.75A8.94 8.94 0 0 1 3 12zM12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function type(elId, text, speed, highlightWords, callback) {
        let i = 0;
        const el = document.getElementById(elId);
        const timer = setInterval(() => {
            let current = text.substring(0, i + 1);
            
            highlightWords.forEach(word => {
                if (current.includes(word)) {
                    current = current.replace(word, `<span class="text-sapphire">${word}</span>`);
                } else if (word.startsWith(current) && current.length > 2) {
                    current = `<span class="text-sapphire">${current}</span>`;
                }
            });

            el.innerHTML = current;
            i++;
            if (i === text.length) { clearInterval(timer); if (callback) callback(); }
        }, speed);
    }

    window.onload = () => {
        type("name-type", "Avery Wong", 100, ["Avery"], () => {
            document.getElementById("name-cursor").style.display = "none";
            document.getElementById("title-cursor").classList.remove("hidden");
            // Highlight "Engineer", not "Mechanical"
            type("title-type", "Mechanical Engineer.", 80, ["Engineer"], null);
        });
        handleScroll();
    };

    const track = document.getElementById('transition-track');
    const card = document.getElementById('main-card');
    const frontFace = document.getElementById('front-face');
    const gearSvg = document.getElementById('main-gear-svg');
    const slot = document.getElementById('image-slot');
    const hero = document.getElementById('hero-layer');
    const projectReveal = document.getElementById('projects-reveal-layer');

    function handleScroll() {
        const rect = track.getBoundingClientRect();
        const slotRect = slot.getBoundingClientRect();
        const vh = window.innerHeight;
        const vw = window.innerWidth;
        
        let progress = -rect.top / (rect.height - vh);
        progress = Math.max(0, Math.min(1, progress));

        let x=0, y=0, scale=0.32, rotY=0, rotZ=0, hOp=1, pOp=0, radius=80;

        // Hero fades out quickly
        hOp = Math.max(0, 1 - (progress * 10));

        const startX = (slotRect.left + slotRect.width/2) - (vw/2);
        const startY = (slotRect.top + slotRect.height/2) - (vh/2);

        if (progress <= 0.1) {
            x = startX; y = startY;
        } 
        else if (progress <= 0.4) {
            // Flip and center
            const p = (progress - 0.1) / 0.3;
            x = startX * (1 - p);
            y = startY * (1 - p);
            rotY = p * 180;
            rotZ = p * 90;
            scale = 0.32;
        } 
        else if (progress <= 0.95) {
            // Expand gear MASSIVELY
            const p = (progress - 0.4) / 0.55;
            rotY = 180;
            rotZ = 90 + (p * 240);
            
            // Scale needs to be large enough that the center hole (about 1/4 of SVG) fills the screen
            const targetScale = (Math.max(vw, vh) / 1000) * 12; 
            scale = 0.32 + (Math.pow(p, 3) * (targetScale - 0.32));
            
            // Fade projects in as gear expands
            pOp = Math.max(0, (p - 0.5) * 2); 
            radius = 80 * (1 - p);
        } else {
            rotY = 180;
            scale = (Math.max(vw, vh) / 1000) * 12;
            pOp = 1;
            rotZ = 330;
        }

        frontFace.style.opacity = (rotY > 90) ? '0' : '1';
        card.style.transform = `translate(${x}px, ${y}px) rotateY(${rotY}deg) scale(${scale})`;
        
        gearSvg.style.transform = `rotate(${rotZ}deg)`;
        
        hero.style.opacity = hOp;
        projectReveal.style.opacity = pOp;
        projectReveal.style.pointerEvents = pOp > 0.8 ? 'auto' : 'none';
    }

    window.addEventListener('scroll', handleScroll);
    window.addEventListener('resize', handleScroll);
</script>
</body>
</html>
