<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avery Wong | Mechanical Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --sapphire: #0F52BA; --bg-color: #f5f5f7; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1d1d1f; margin: 0; overflow-x: hidden; }

        .text-sapphire { color: var(--sapphire); }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        
        @keyframes spin-nav { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-gear-nav { animation: spin-nav 8s linear infinite; }

        .apple-bubble { background: var(--bg-color); border-radius: 3.5rem; border: 1px solid rgba(0,0,0,0.03); }
        
        /* PROJECTS STYLING */
        .project-bubble { 
            background: white; 
            border-radius: 3.5rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 300px; 
            border: 1px solid rgba(0,0,0,0.05); 
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); 
            width: 100%; 
            padding: 2rem;
            text-align: center;
        }
        .project-bubble:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.04); }

        .cursor { display: inline-block; width: 3px; background-color: var(--sapphire); margin-left: 4px; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* SCROLL ENGINE */
        #transition-track { height: 600vh; position: relative; }
        
        .sticky-viewport { 
            position: sticky; 
            top: 0; 
            height: 100vh; 
            width: 100%; 
            overflow: hidden; 
            background: white;
        }

        .layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        #projects-layer {
            opacity: 0;
            z-index: 10;
            padding: 120px 2rem;
            overflow-y: auto;
            background: var(--bg-color); /* Matches gear background */
            pointer-events: none;
        }

        #hero-layer { justify-content: center; z-index: 20; }

        .card-container { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            perspective: 2000px; 
            z-index: 100; 
            pointer-events: none; 
        }
        
        .flip-card { width: 800px; height: 800px; transform-style: preserve-3d; }
        
        .card-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 80px;
        }
        
        .card-front { background: #eee; overflow: hidden; z-index: 2; }
        /* Gear Card background matches page background */
        .card-back { background: var(--bg-color); transform: rotateY(180deg); z-index: 1; }

        #main-gear-svg { 
            width: 60%; 
            height: 60%; 
            stroke: var(--sapphire);
            fill: none;
            stroke-width: 1.2;
        }
    </style>
</head>
<body>

<nav class="glass fixed top-0 w-full z-[200] border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-6 h-12 flex justify-between items-center text-sm font-medium">
        <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-sapphire animate-gear-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0 .33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span class="font-bold">Avery Wong</span>
        </div>
        <div class="space-x-8">
            <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="text-gray-500 hover:text-black transition">About</button>
            <a href="mailto:averywong3@gmail.com" class="hover:text-sapphire transition">Contact</a>
        </div>
    </div>
</nav>

<div id="transition-track">
    <div class="sticky-viewport">
        
        <!-- PROJECTS SECTION (Revealed by Gear Zoom) -->
        <div id="projects-layer" class="layer">
            <div class="max-w-6xl mx-auto w-full">
                <h2 class="text-6xl font-black mb-16 tracking-tighter text-center">Selected Works</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-20">
                    <div class="project-bubble">
                        <h3 class="text-3xl font-bold">Robotic Cinematography Arm</h3>
                    </div>
                    <div class="project-bubble bg-[#1d1d1f] text-white border-none">
                        <h3 class="text-3xl font-bold">Smart Knee Sleeve</h3>
                    </div>
                    <div class="project-bubble">
                        <h3 class="text-3xl font-bold">Integrated Desk Outlets</h3>
                    </div>
                    <div class="project-bubble bg-zinc-200 border-none">
                        <h3 class="text-3xl font-bold text-zinc-800">Mechanical Dissections</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- HERO CONTENT -->
        <div id="hero-layer" class="layer px-6">
            <div class="text-center mb-12">
                <div class="text-2xl md:text-4xl font-bold tracking-tight mb-2 h-10">
                    <span id="name-type"></span><span id="name-cursor" class="cursor"></span>
                </div>
                <h1 class="text-6xl md:text-8xl font-extrabold tracking-tighter leading-none h-24 md:h-32">
                    <span id="title-type"></span><span id="title-cursor" class="cursor hidden"></span>
                </h1>
            </div>

            <div id="about-bubble" class="apple-bubble max-w-5xl w-full p-8 md:p-12 flex flex-col md:flex-row items-center gap-12">
                <div class="flex-1 space-y-6">
                    <h2 class="text-5xl font-extrabold tracking-tight">About</h2>
                    <p class="text-gray-500 text-lg leading-relaxed">Mechanical engineering student at the University of Toronto. Specializing in functional prototyping and elegant R&D solutions.</p>
                    <div class="flex flex-wrap gap-4">
                        <a href="https://www.linkedin.com/in/averywong0" target="_blank" class="inline-block bg-white border border-gray-200 px-8 py-4 rounded-3xl text-sm font-bold hover:border-sapphire transition shadow-sm uppercase tracking-wider">LinkedIn ↗</a>
                        <div class="inline-block bg-white border border-gray-200 px-8 py-4 rounded-3xl text-sm font-bold text-sapphire shadow-sm">averywong3@gmail.com</div>
                    </div>
                </div>
                <div id="image-slot" class="w-full md:w-[320px] h-[320px] flex-shrink-0"></div>
            </div>
        </div>

        <!-- TRANSITION GEAR CARD -->
        <div class="card-container">
            <div class="flip-card" id="main-card">
                <div class="card-face card-front" id="front-face">
                    <img src="headshot.jpg" alt="Avery" class="w-full h-full object-cover grayscale brightness-105">
                </div>
                <div class="card-face card-back" id="back-face">
                    <svg id="main-gear-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0 .33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * Logic: 
     * - "Avery" and "Engineer" stay Blue while typing.
     * - "Wong" and "Mechanical" stay Black while typing.
     */
    function type(elId, fullText, speed, callback) {
        let i = 0;
        const el = document.getElementById(elId);
        const blueWords = ["Avery", "Engineer"];
        
        const timer = setInterval(() => {
            let currentStr = fullText.substring(0, i + 1);
            let words = currentStr.split(/(\s+)/); // Split keep spaces
            
            let html = "";
            words.forEach(word => {
                const cleanWord = word.trim();
                // If the word we are typing starts with or is one of the blue words
                if (blueWords.some(bw => cleanWord.startsWith(bw) || bw.startsWith(cleanWord)) && cleanWord !== "") {
                    html += `<span class="text-sapphire">${word}</span>`;
                } else {
                    html += `<span>${word}</span>`;
                }
            });

            el.innerHTML = html;
            i++;
            if (i === fullText.length) {
                clearInterval(timer);
                if (callback) callback();
            }
        }, speed);
    }

    window.onload = () => {
        type("name-type", "Avery Wong", 100, () => {
            document.getElementById("name-cursor").style.display = "none";
            document.getElementById("title-cursor").classList.remove("hidden");
            type("title-type", "Mechanical Engineer.", 80, null);
        });
        handleScroll();
    };

    const track = document.getElementById('transition-track');
    const card = document.getElementById('main-card');
    const frontFace = document.getElementById('front-face');
    const backFace = document.getElementById('back-face');
    const gearSvg = document.getElementById('main-gear-svg');
    const slot = document.getElementById('image-slot');
    const hero = document.getElementById('hero-layer');
    const projects = document.getElementById('projects-layer');

    function handleScroll() {
        const rect = track.getBoundingClientRect();
        const slotRect = slot.getBoundingClientRect();
        const vh = window.innerHeight;
        const vw = window.innerWidth;
        
        let progress = -rect.top / (rect.height - vh);
        progress = Math.max(0, Math.min(1, progress));

        let x=0, y=0, scale=0.4, rotY=0, rotZ=0, hOp=1, pOp=0;

        // 1. Hero Content fades out early
        hOp = Math.max(0, 1 - (progress * 10));

        const startX = (slotRect.left + slotRect.width/2) - (vw/2);
        const startY = (slotRect.top + slotRect.height/2) - (vh/2);

        if (progress <= 0.05) {
            x = startX; y = startY;
        } 
        else if (progress <= 0.3) {
            // Flip card and move to center
            const p = (progress - 0.05) / 0.25;
            x = startX * (1 - p);
            y = startY * (1 - p);
            rotY = p * 180;
            rotZ = p * 90;
            scale = 0.4;
        } 
        else if (progress <= 0.95) {
            // Zoom gear portal
            const p = (progress - 0.3) / 0.65;
            rotY = 180;
            rotZ = 90 + (p * 420);
            
            // Extreme scale to zoom through the hole
            const targetScale = (Math.max(vw, vh) / 800) * 20; 
            scale = 0.4 + (Math.pow(p, 4) * (targetScale - 0.4));
            
            // Fade projects in only after gear is quite large
            pOp = Math.max(0, (p - 0.4) * 1.8);
        } else {
            rotY = 180;
            scale = (Math.max(vw, vh) / 800) * 20;
            pOp = 1;
        }

        frontFace.style.opacity = (rotY > 90) ? '0' : '1';
        backFace.style.opacity = (rotY > 90) ? '1' : '0';
        card.style.transform = `translate(${x}px, ${y}px) rotateY(${rotY}deg) scale(${scale})`;
        gearSvg.style.transform = `rotate(${rotZ}deg)`;
        
        hero.style.opacity = hOp;
        projects.style.opacity = pOp;
        projects.style.pointerEvents = pOp > 0.6 ? 'auto' : 'none';
    }

    window.addEventListener('scroll', handleScroll);
    window.addEventListener('resize', handleScroll);
</script>
</body>
</html>
